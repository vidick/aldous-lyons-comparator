name: comparator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Compiling MIPRE-formalization from source (about 400k lines, one module of 71k, and the
    # MIPStarRE dependency's 337 modules) dominates the run.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      # Mathlib's cache and the compiled library together are larger than the runner's free
      # space by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # The export of the whole library and its replay can exceed the runner's 16 GB.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /comparator.swap
          sudo chmod 600 /comparator.swap
          sudo mkswap /comparator.swap
          sudo swapon /comparator.swap
          free -h
      # `lake comparator` sandboxes the build with bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu 24.04 restricts them through AppArmor by default.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run comparator
        run: ./verify.sh
